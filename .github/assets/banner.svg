<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="Accra Dental Clinic">
  <defs>
    <!-- Key light from the upper left, as in the site hero. Kept faint: at 0.16
         it read as a brown smudge rather than as light. -->
    <radialGradient id="glow" cx="0.2" cy="0.18" r="0.85">
      <stop offset="0%" stop-color="#e0a02c" stop-opacity="0.1" />
      <stop offset="52%" stop-color="#e0a02c" stop-opacity="0.025" />
      <stop offset="100%" stop-color="#e0a02c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8f3d1c" stop-opacity="0" />
      <stop offset="100%" stop-color="#8f3d1c" stop-opacity="0.1" />
    </linearGradient>
    <!-- Fine dot field. A pattern, not a filter, so camo cannot strip it. -->
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.55" fill="#f4ede3" fill-opacity="0.045" />
      <circle cx="5" cy="4.5" r="0.4" fill="#f4ede3" fill-opacity="0.03" />
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#14100d" />
  <rect width="1280" height="640" fill="url(#glow)" />
  <rect width="1280" height="640" fill="url(#grain)" />
  <rect width="1280" height="640" fill="url(#haze)" />

  <!-- Ground line the arcade stands on. -->
  <rect x="586" y="438" width="632" height="1.25" fill="#e0a02c" fill-opacity="0.32" />

  <!-- The arcade. -->
  <g fill="none" stroke="#e0a02c" stroke-linecap="round">
    <path d="M 624.0 438 V 372.0 A 278 278 0 0 1 1180.0 372.0 V 438" stroke-opacity="0.18" stroke-width="1" />
    <path d="M 670.0 438 V 374.0 A 232 232 0 0 1 1134.0 374.0 V 438" stroke-opacity="0.26" stroke-width="1" />
    <path d="M 716.0 438 V 376.0 A 186 186 0 0 1 1088.0 376.0 V 438" stroke-opacity="0.36" stroke-width="1.25" />
    <path d="M 762.0 438 V 382.0 A 140 140 0 0 1 1042.0 382.0 V 438" stroke-opacity="0.52" stroke-width="1.25" />
    <path d="M 808.0 438 V 390.0 A 94 94 0 0 1 996.0 390.0 V 438" stroke-opacity="0.74" stroke-width="1.5" />
    <path d="M 852.0 438 V 402.0 A 50 50 0 0 1 952.0 402.0 V 438" stroke-opacity="0.92" stroke-width="1.5" />
  </g>

  <!-- Left: one rule and one mark. The README carries the words, so the image
       only has to hold the left third open — anything more reads as clutter. -->
  <rect x="104" y="196" width="2" height="242" fill="#e0a02c" fill-opacity="0.5" />
  <circle cx="105" cy="172" r="5.5" fill="#e0a02c" fill-opacity="0.85" />

  <!-- Clay hairline at the very bottom: the one warm interruption, kept to a
       rule. An earlier version used a 74px clay block and read as a hazard
       stripe rather than as part of the palette. -->
  <rect x="0" y="635" width="1280" height="5" fill="#8f3d1c" fill-opacity="0.85" />
</svg>
