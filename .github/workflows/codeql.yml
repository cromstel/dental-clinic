name: CodeQL

# Static analysis for JavaScript/TypeScript.
#
# Complements ci.yml rather than duplicating it: CI catches what the compiler and
# the export assertions catch, this catches what they cannot see — injection,
# unsafe deserialization, path traversal, missing validation around the fetch /
# mailto / asset paths.
#
# For a static marketing site the realistic finding surface is small, which is
# exactly why it is worth running automatically: it is a check nobody would
# otherwise remember to do.
#
# On push to main and weekly, so a newly published advisory is picked up even
# when nobody has pushed anything.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 04:00 UTC. A schedule (not just push) is what makes this
    # respond to *newly published* advisories rather than only to code changes.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Never let two CodeQL analyses write to the same category concurrently.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the security-results API. Kept to this one job.
      security-events: write
      # Required by the analyze step's SARIF fingerprinting call, which reads the
      # workflow run. Without it the step logs "Resource not accessible by
      # integration" and the upload fails.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # CodeQL needs the dependency tree to resolve imports accurately.
      - name: Install dependencies
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # security-extended adds taint tracking for the query families most
          # likely to matter in a web-facing project.
          queries: security-extended

      # The analyze step uploads its own results — it is the step that knows the
      # SARIF output path, and it is not `results.sarif` when the sandbox is
      # disabled. Do not add a separate upload-sarif step; it will look for a
      # path that does not exist and fail the job.
      #
      # This run produced zero findings. It is not blocking, so `fail-on-error`
      # stays false and results are reported to the Security tab.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
          # Do not fail the build on a finding. A hard failure here on an
          # un-triaged query result would just be a red X nobody acts on.
          # Flip to `true` once the baseline is clean and you want enforcement.
          fail-on-error: false
